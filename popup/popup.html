<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h3>Gemini Temp-to-Save</h3>
        <p class="desc">צבירה ואיחוד של הקשרי שיחה מרובים</p>
        
        <button id="save-btn">שאב והוסף לזיכרון המצטבר</button>
        <button id="fork-mode-btn" style="background-color: #fbbc04; color: #202124; margin-top: 8px;">הפעל מצב פיצול</button>
        
        <button id="inject-btn" style="display: none; background-color: #0f9d58; margin-top: 16px;">הזרק את המידע שנצבר</button>
        <button id="clear-btn" style="display: none; background-color: #ea4335; color: white; margin-top: 8px; padding: 6px 12px; font-size: 12px;">נקה זיכרון מצטבר</button>
        
        <p id="status-msg"></p>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
